apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-resume
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resume-viewer
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resume-viewer
subjects:
  - kind: ServiceAccount
    name: service-resume
    namespace: resume
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resume-viewer
