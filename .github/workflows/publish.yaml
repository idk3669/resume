name: Test, publish and promote
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements.lock -r api/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@10.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/idk3669/resume-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/idk3669/resume
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/idk3669/resume-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/idk3669/resume
      - name: Publish tested deployment snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: bash scripts/promote-deployment.sh
