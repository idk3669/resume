apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: resume-gateway
  namespace: resume
spec:
  gatewayClassName: resume-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: resume-web
  namespace: resume
spec:
  parentRefs:
    - name: resume-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: resume-web
          port: 8080
