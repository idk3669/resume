worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    upstream resume_backend { server resume-api:8000; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /health/live { access_log off; return 200 'alive'; }
        location = /health/ready { access_log off; try_files /index.html =503; }
        location /api/ {
            proxy_pass http://resume_backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location /assets/ { try_files $uri =404; }
        location /portfolio/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
